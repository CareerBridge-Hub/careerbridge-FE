server {
    listen 8080;
    server_name _;
    root /srv/careerbridge;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # The backend workflow publishes port 8080 on the same VPS.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve HTTPS from the trusted TLS proxy in front of this container.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 20m;
    }

    # Vite emits content-hashed files here; missing chunks must return 404.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /app { return 308 /app/; }
    location /app/ {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /app/index.html;
    }
    location ~* \.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
