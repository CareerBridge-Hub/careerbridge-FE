name: Publish to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vps-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build dist and publish runtime image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass
      - name: Deploy immutable image to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}"
          : "${VPS_USERNAME:?Set VPS_USERNAME}"
          : "${SSHPASS:?Set VPS_PASSWORD}"
          {
            for name in GHCR_USERNAME GHCR_TOKEN IMAGE; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          # The backend workflow owns ~/careerbridge (compose.yaml, Caddyfile, be.env).
          if ! cd "$HOME/careerbridge" 2>/dev/null || [ ! -f compose.yaml ]; then
            echo 'No ~/careerbridge/compose.yaml on the VPS. Run the backend "Publish to VPS" workflow first.' >&2
            exit 1
          fi
          # Keep the registry token out of ~/.docker; compose runs after it is gone.
          (
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"
          )
          umask 077
          # ponytail: no lock on .env; the backend workflow edits BE_IMAGE and DOMAIN
          # in the same file. Add flock if the two deploys ever overlap in practice.
          set_env() {
            { grep -v "^$1=" .env 2>/dev/null || true; printf '%s=%s\n' "$1" "$2"; } > .env.tmp
            mv .env.tmp .env
          }
          start_fe() {
            set_env FE_IMAGE "$1" || return 1
            docker compose up -d --no-deps fe || return 1
            fe_id=$(docker compose ps -q fe)
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$fe_id")" = healthy ]; then
                return 0
              fi
              sleep 2
            done
            docker compose logs --tail 50 fe >&2
            return 1
          }
          previous=$(sed -n 's/^FE_IMAGE=//p' .env 2>/dev/null || true)
          # Retire the pre-compose containers and their public port 3000.
          docker rm -f careerbridge-fe careerbridge-fe-previous 2>/dev/null || true
          if ! start_fe "$IMAGE"; then
            echo 'Frontend failed its health check.' >&2
            if [ -n "$previous" ] && [ "$previous" != "$IMAGE" ]; then
              echo "Restoring $previous." >&2
              start_fe "$previous" || true
            fi
            exit 1
          fi
          REMOTE
          } | sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$VPS_USERNAME@$VPS_HOST" 'bash -s'
